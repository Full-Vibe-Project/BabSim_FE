<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 프로필 설정</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Inter 폰트 (Next.js에서는 _app.js나 layout.js에서 폰트 설정을 하실 겁니다) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        // Tailwind 커스텀 설정
        tailwind.config = {
            theme: {
                extend: {
                    // 이미지에서 사용된 색상 견본
                    colors: {
                        'custom-bg': '#f8f5f0', // 메인 배경색 (따뜻한 베이지)
                        'custom-brown-dark': '#9a846f', // '다음' 버튼 배경
                        'custom-brown-light': '#b9a389', // '여성' 선택 버튼 배경
                        'custom-text-dark': '#333333', // 기본 텍스트 (더 진하게)
                        'custom-text-light': '#6b7280', // 보조 텍스트
                    },
                    fontFamily: {
                        // 기본 폰트를 Noto Sans KR로 설정
                        sans: ['Noto Sans KR', 'Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* 기본 폰트와 배경색 적용 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f5f0;
        }
    </style>
</head>
<body class="bg-custom-bg text-custom-text-dark">

    <!-- 
      Next.js 컴포넌트로 사용할 때 이 div가 메인 컨테이너가 됩니다.
      max-w-md, mx-auto 등은 앱의 전체 레이아웃에 맞게 조정하세요.
    -->
    <div class="flex flex-col min-h-screen max-w-md mx-auto p-6">

        <!-- 1. 헤더: 뒤로가기 버튼 및 진행상태 -->
        <header class="flex justify-between items-center py-2">
            <!-- 뒤로가기 버튼 (SVG 아이콘) -->
            <button class="p-2 text-stone-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            
            <!-- 진행 상태 -->
            <span class="text-sm font-medium text-stone-500">1/3</span>
        </header>

        <!-- 2. 메인 콘텐츠: 폼 영역 -->
        <main class="flex-grow pt-8 pb-12">
            <div class="space-y-8">
                
                <!-- 제목 및 설명 -->
                <div class="space-y-2">
                    <h1 class="text-3xl font-bold text-stone-900">기본 프로필</h1>
                    <p class="text-stone-600">맞춤형 건강 관리를 위해 기본 정보를 입력해주세요.</p>
                </div>
                
                <!-- 입력 폼 -->
                <form class="space-y-6" onsubmit="event.preventDefault();">
                  
                    <!-- 이름 -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-stone-700 mb-2">이름</label>
                        <input type="text" id="name" 
                               placeholder="이름을 입력하세요" 
                               class="bg-white rounded-lg w-full p-4 text-stone-900 placeholder:text-stone-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-custom-brown-light">
                    </div>
                  
                    <!-- 성별 -->
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-2">성별</label>
                        <div class="grid grid-cols-2 gap-3">
                            <!-- 선택된 상태 -->
                            <button type="button" class="bg-custom-brown-light text-white py-3.5 rounded-lg font-semibold shadow-sm">
                                여성
                            </button>
                            <!-- 선택되지 않은 상태 -->
                            <button type="button" class="bg-white text-stone-700 py-3.5 rounded-lg font-semibold shadow-sm">
                                남성
                            </button>
                        </div>
                    </div>
                  
                    <!-- 생년월일 -->
                    <div>
                        <label for="dob" class="block text-sm font-medium text-stone-700 mb-2">생년월일</label>
                        <!-- 이미지에는 placeholder가 비어있습니다 -->
                        <input type="text" id="dob" 
                               placeholder="" 
                               class="bg-white rounded-lg w-full p-4 text-stone-900 placeholder:text-stone-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-custom-brown-light">
                    </div>
                  
                    <!-- 키 / 몸무게 -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="height" class="block text-sm font-medium text-stone-700 mb-2">키 (cm)</label>
                            <input type="text" id="height" value="165" 
                                   class="bg-white rounded-lg w-full p-4 text-stone-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-custom-brown-light">
                        </div>
                        <div>
                            <label for="weight" class="block text-sm font-medium text-stone-700 mb-2">몸무게 (kg)</label>
                            <input type="text" id="weight" value="50" 
                                   class="bg-white rounded-lg w-full p-4 text-stone-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-custom-brown-light">
                        </div>
                    </div>

                </form>
            </div>
        </main>

        <!-- 3. 푸터: '다음' 버튼 -->
        <footer class="pb-4 pt-4">
            <button type="button" class="w-full bg-custom-brown-dark text-white font-bold py-4 rounded-lg shadow-md hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-custom-brown-dark focus:ring-offset-2">
                다음
            </button>
        </footer>

    </div>

</body>
</html>
